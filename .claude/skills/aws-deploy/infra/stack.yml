AWSTemplateFormatVersion: "2010-09-09"
Description: ACME Salary Management - one EC2 server running Docker Compose, plus S3, ECR, logs, snapshots, a budget alert and a wake page.

Parameters:
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: Ubuntu 24.04 arm64 image. Set once by deploy.sh when the stack is created; changing it replaces the server.
  Domain:
    Type: String
    AllowedPattern: "^[a-z0-9-]+(\\.[a-z0-9-]+)+$"
    Description: The app's address, e.g. acme.docrelay.in. The wake page is wake.<Domain>.
  WakeCertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate for wake.<Domain> in this region, requested by deploy.sh. Empty = no wake address yet.
  AlertEmail:
    Type: String
    Description: Receives the budget alerts.
  BudgetUsd:
    Type: Number
    MinValue: 1
    Description: Monthly cost (USD) that triggers the budget alert email.
  GitHubSubjectPrefix:
    Type: String
    Default: ""
    AllowedPattern: "^$|^repo:[^:*\\s]+$"
    Description: >-
      The repo's OIDC subject prefix, allowed to release through the GitHub Deploy button
      (gh api repos/OWNER/REPO/actions/oidc/customization/sub --jq .sub_claim_prefix).
      Empty = no GitHub access.

Conditions:
  HasGitHubRepo: !Not [!Equals [!Ref GitHubSubjectPrefix, ""]]
  HasWakeDomain: !Not [!Equals [!Ref WakeCertificateArn, ""]]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      # A temporary public address so first-boot setup can download packages before the Elastic IP attaches.
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable

  # Only web traffic. No SSH: admin access goes through SSM Session Manager.
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP and HTTPS only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-backups
            Status: Enabled
            Prefix: backups/
            ExpirationInDays: 14

  Repository:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: true
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules": [{"rulePriority": 1, "description": "Drop replaced build caches after a day",
            "selection": {"tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 1},
            "action": {"type": "expire"}},
           {"rulePriority": 2, "description": "Keep the last 10 images",
            "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10},
            "action": {"type": "expire"}}]}

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${AWS::StackName}
      RetentionInDays: 30

  # The server's own permissions: no access keys live on the machine.
  ServerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub ${Bucket.Arn}/*
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${LogGroup.Arn}
              - Effect: Allow
                Action: ssm:GetParametersByPath
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}

  ServerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ServerRole]

  Server:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t4g.small
      ImageId: !Ref ImageId
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref WebSecurityGroup]
      IamInstanceProfile: !Ref ServerProfile
      InstanceInitiatedShutdownBehavior: stop
      PropagateTagsToVolumeOnCreation: true
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true }
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }
        - { Key: Backup, Value: !Sub "${AWS::StackName}-weekly" }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          for i in 1 2 3 4 5; do apt-get update && break; sleep 10; done
          apt-get install -y docker.io docker-compose-v2
          snap install aws-cli --classic
          systemctl enable --now docker
          mkdir -p /opt/acme/release

  ServerAddress:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref Server

  SnapshotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: dlm.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole

  WeeklySnapshots:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: Weekly snapshot of the server disk - 4 kept
      State: ENABLED
      ExecutionRoleArn: !GetAtt SnapshotRole.Arn
      PolicyDetails:
        ResourceTypes: [VOLUME]
        TargetTags:
          - { Key: Backup, Value: !Sub "${AWS::StackName}-weekly" }
        Schedules:
          - Name: weekly
            CreateRule: { CronExpression: "cron(0 22 ? * SUN *)" }
            RetainRule: { Count: 4 }
            CopyTags: true

  # Wake page: wake.<Domain> starts the stopped server for anyone with the wake code (in SSM).
  # It lives outside the server so it answers while the server is off. deploy.sh uploads the
  # code in wake/ after each stack update; the inline code is only a placeholder until then.
  WakeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${AWS::StackName}/wake
      RetentionInDays: 30

  WakeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: wake
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
              - Effect: Allow
                Action: ec2:StartInstances
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Server}
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/wake/WAKE_CODE
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt WakeLogGroup.Arn

  WakeFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 128
      Timeout: 10
      Role: !GetAtt WakeRole.Arn
      LoggingConfig: { LogGroup: !Ref WakeLogGroup }
      Environment:
        Variables:
          INSTANCE_ID: !Ref Server
          CODE_PARAM: !Sub /${AWS::StackName}/wake/WAKE_CODE
          SITE_URL: !Sub https://${Domain}
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 503, "body": "The wake page is not deployed yet."}

  WakeApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-wake
      ProtocolType: HTTP
      # Only reachable at wake.<Domain>.
      DisableExecuteApiEndpoint: true

  WakeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WakeApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt WakeFunction.Arn
      PayloadFormatVersion: "2.0"

  WakePageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WakeApi
      RouteKey: GET /
      Target: !Sub integrations/${WakeIntegration}

  WakeStatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WakeApi
      RouteKey: GET /status
      Target: !Sub integrations/${WakeIntegration}

  WakeStartRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WakeApi
      RouteKey: POST /start
      Target: !Sub integrations/${WakeIntegration}

  # Throttled for everyone together: guessing the code is hopeless and a flood can't run up a bill.
  WakeStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WakeApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings: { ThrottlingRateLimit: 2, ThrottlingBurstLimit: 10 }

  WakeInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WakeFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WakeApi}/*

  WakeDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasWakeDomain
    Properties:
      DomainName: !Sub wake.${Domain}
      DomainNameConfigurations:
        - { CertificateArn: !Ref WakeCertificateArn, EndpointType: REGIONAL, SecurityPolicy: TLS_1_2 }

  WakeMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasWakeDomain
    DependsOn: WakeStage
    Properties:
      ApiId: !Ref WakeApi
      DomainName: !Ref WakeDomainName
      Stage: $default

  # An alert, not a cap: AWS emails when the month's cost passes 80% or is forecast to pass 100%.
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref BudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

  # GitHub Actions signs in with short-lived OIDC tokens: no AWS keys are stored in GitHub.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: HasGitHubRepo
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # Release: push the image, sync the server scripts, start the server and run the update.
  # It cannot change the stack, IAM or the SSM secrets. It is still root on the server: it
  # runs shell commands there and writes the scripts the server runs as root, so it can read
  # /opt/acme/.env. That is why only "production" environment jobs can assume it.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Condition: HasGitHubRepo
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidcProvider }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only jobs in this repo that run in the "production" environment. The prefix holds the
                # owner and repo IDs, so a renamed or re-created repo with the same name can't match.
                token.actions.githubusercontent.com:sub: !Sub ${GitHubSubjectPrefix}:environment:production
      Policies:
        - PolicyName: release
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId
              - Effect: Allow
                Action: [ec2:DescribeInstances, ssm:DescribeInstanceInformation, ssm:GetCommandInvocation, ecr:GetAuthorizationToken]
                Resource: "*"
              - Effect: Allow
                Action: ec2:StartInstances
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Server}
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Server}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
                Condition: { StringLike: { s3:prefix: ["deploy/*", "deploy/"] } }
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub ${Bucket.Arn}/deploy/*

Outputs:
  InstanceId:
    Value: !Ref Server
  PublicIp:
    Value: !Ref ServerAddress
  BucketName:
    Value: !Ref Bucket
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  LogGroup:
    Value: !Ref LogGroup
  WakeFunctionName:
    Value: !Ref WakeFunction
  WakeTarget:
    Condition: HasWakeDomain
    Description: Where the wake.<Domain> CNAME points.
    Value: !GetAtt WakeDomainName.RegionalDomainName
  DeployRoleArn:
    Condition: HasGitHubRepo
    Value: !GetAtt GitHubDeployRole.Arn
