# Production services on the server. Values come from /opt/acme/.env (written by remote-update.sh).
x-logging: &logging
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION}
    awslogs-group: ${LOG_GROUP}
    tag: "{{.Name}}"

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://acme:${POSTGRES_PASSWORD}@db:5432/acme
  SECRET_KEY: ${SECRET_KEY}
  SESSION_COOKIE_SECURE: "true"
  DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
  DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD}
  STORAGE_DIR: /data/storage
  LOG_LEVEL: INFO

services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    logging: *logging

  app:
    image: ${IMAGE}
    restart: unless-stopped
    environment: *app-env
    volumes: [storage:/data/storage]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *logging

  worker:
    image: ${IMAGE}
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment: *app-env
    volumes: [storage:/data/storage]
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: acme
      POSTGRES_DB: acme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "acme", "-d", "acme"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
