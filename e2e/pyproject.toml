[project]
name = "acme-oracles"
version = "0.1.0"
description = "ACME Pay as-user oracles: real-browser checks of the running app"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
